# kagami scopes for ShellKit — the one way to run this package's tests
# (never `swift test` from an agent). Registered 2026-09-25 with the
# direct-exec fix so the kit has a gate of its own.
[[scopes]]
name = "ShellKit"
language = "swift"
package_path = "."
test_target_name = "ShellKitTests"
type_patterns = ["TimedShellExecutorTests"]
test_file_patterns = ["**/ShellKitTests/TimedShellExecutorTests.swift"]
expected_test_min = 12
timeout_seconds = 600
description = "ShellKit — TimedShellExecutor: pipe/deadlock, timeout, concurrency cap, exit codes, and the launch plan (absolute executable execs directly so DYLD_* survive)."

# DetachedProcess — the fire-and-forget launch (2026-10-12). Added because
# shikki#1789's spec dispatcher, the validated-spec drainer and the flow
# dispatcher each hand-rolled `Process()` behind a bypass exemption: ShellKit
# had no primitive that starts a long-running child, keeps its pid for a
# reaper, and sends its output anywhere but a pipe nobody drains.
[[scopes]]
name = "ShellKitDetached"
language = "swift"
package_path = "."
test_target_name = "ShellKitTests"
type_patterns = ["DetachedProcessTests", "DetachedProcess", "DetachedOutput"]
test_file_patterns = ["**/ShellKitTests/DetachedProcessTests.swift"]
expected_test_min = 8
timeout_seconds = 600
description = "ShellKit — DetachedProcess: pid for the reaper, chatty child never blocks, output to file or /dev/null, exit code, no shell re-parse, idempotent terminate. Run: kagami test --scope ShellKitDetached --strict"

# InteractiveProcess + ExecutableResolver (added with the Linux port: these tests
# were in no scope, so neither platform's gate ever ran them).
[[scopes]]
name = "ShellKitInteractive"
language = "swift"
package_path = "."
test_target_name = "ShellKitTests"
type_patterns = ["InteractiveProcessTests"]
test_file_patterns = ["**/ShellKitTests/InteractiveProcessTests.swift"]
expected_test_min = 7
timeout_seconds = 600
description = "ShellKit — InteractiveProcess: interleaved exchange, deadline reads, stderr drain, SIGKILL escalation, ExecutableResolver. Run: kagami test --scope ShellKitInteractive --strict"

# runStreaming / ShellExecutorProtocol (Swift Testing), likewise unscoped until now.
[[scopes]]
name = "ShellKitStreaming"
language = "swift"
package_path = "."
test_target_name = "ShellKitTests"
type_patterns = ["RunStreamingTests", "LegacyConformerTests"]
test_file_patterns = ["**/ShellKitTests/RunStreamingTests.swift"]
expected_test_min = 8
timeout_seconds = 600
description = "ShellKit — TimedShellExecutor.runStreaming: live chunks, independent stderr, timeout kill, protocol fallback. Run: kagami test --scope ShellKitStreaming --strict"

[[scopes]]
# Spec c8fa126c W5. The portability ratchet plus the Linux hang regressions.
# Registered rather than left to auto-discovery because its value is that it runs
# on EVERY delivered head: the two defects it pins — an Apple-capability
# condition outside Platform/, and a POSIX gate that omits musl — are invisible
# to both a macOS test run and a musl cross build.
#
# No `test_command` here on purpose. An explicit one made kagami refuse to count
# ("Fix: add or update count_pattern"): it can only tally output from a command
# it composed itself. The sibling scopes all let it derive the filter from
# `type_patterns`, so this one does too.
description = "ShellKit — portability ratchet (Apple-capability conditions, musl gates, libc qualifiers in Sources and Tests) plus the Linux hang regressions. Run: kagami test --scope ShellKitPortability"
expected_test_min = 10
language = "swift"
name = "ShellKitPortability"
package_path = "."
test_file_patterns = ["**/ShellKitTests/Portability/ShellKitPortabilityRatchetTests.swift", "**/ShellKitTests/Portability/LinuxHangRegressionTests.swift"]
test_target_name = "ShellKitTests"
timeout_seconds = 300
type_patterns = ["ShellKitPortabilityRatchetTests", "LinuxHangRegressionTests"]
